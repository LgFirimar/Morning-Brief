<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>בריפינג בוקר ☀️</title>
<link rel="icon" href="icon.png" />
<link rel="apple-touch-icon" href="icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="בריפינג בוקר" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
    background: #f0f2f8;
    direction: rtl;
    min-height: 100vh;
  }

  /* HEADER */
  .header {
    background: linear-gradient(160deg, #0b1a30 0%, #0f3460 100%);
    color: #fff;
    padding: 24px 18px 0;
  }
  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }
  .header-eyebrow {
    font-size: 0.65rem;
    letter-spacing: 2px;
    color: #6fa3c8;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .header-title {
    font-size: 1.55rem;
    font-weight: 900;
    letter-spacing: -0.5px;
  }
  .header-date {
    font-size: 0.78rem;
    color: #7aa8c4;
    margin-top: 3px;
  }
  .btn-settings {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: #aac8e0;
    border-radius: 10px;
    padding: 7px 12px;
    font-size: 0.78rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .thursday-badge {
    display: inline-block;
    background: #1e8449;
    color: #fff;
    font-size: 0.72rem;
    font-weight: 700;
    border-radius: 8px;
    padding: 4px 10px;
    margin-bottom: 14px;
  }

  /* TABS */
  .tabs {
    display: flex;
    gap: 2px;
    margin-top: 4px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0;
    white-space: nowrap;
    font-size: 0.68rem;
    padding: 10px 6px 8px;
    font-weight: 700;
    background: transparent;
    color: #6fa3c8;
    border: none;
    border-radius: 10px 10px 0 0;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    border-bottom: 3px solid transparent;
  }
  .tab.active { background: #f0f2f8; border-bottom: 3px solid transparent; }
  .tab.active.canada  { color: #c0392b; }
  .tab.active.toronto { color: #1a5276; }
  .tab.active.custom  { color: #c0711a; }
  .tab.active.weekend { color: #1e8449; }
  .tab.active.done      { color: #7d3c98; }
  .tab.active.favorites { color: #e67e22; }
  .tab-new {
    display: inline-block;
    background: #e74c3c;
    color: #fff;
    font-size: 0.55rem;
    border-radius: 8px;
    padding: 1px 5px;
    margin-right: 3px;
    vertical-align: middle;
  }
  .tab-count {
    display: inline-block;
    background: #7d3c98;
    color: #fff;
    font-size: 0.55rem;
    border-radius: 10px;
    padding: 1px 5px;
    margin-right: 3px;
    vertical-align: middle;
  }

  /* CONTENT */
  .content {
    max-width: 620px;
    margin: 0 auto;
    padding: 14px 14px 40px;
  }

  /* CARD */
  .card {
    background: #fff;
    border-radius: 14px;
    margin-bottom: 10px;
    overflow: hidden;
    box-shadow: 0 1px 6px rgba(0,0,0,0.06);
    border: 1px solid rgba(0,0,0,0.05);
  }
  .card-done { opacity: 0.6; }
  .card-done-archive { border-right: 3px solid #7d3c98; }
  .card-body { padding: 14px 14px 10px; }
  .card-top { display: flex; gap: 10px; align-items: flex-start; }
  .card-emoji { font-size: 1.5rem; line-height: 1; flex-shrink: 0; }
  .card-meta { display: flex; gap: 5px; margin-bottom: 6px; flex-wrap: wrap; align-items: center; }
  .badge {
    font-size: 0.67rem; font-weight: 700; padding: 2px 9px;
    border-radius: 20px; white-space: nowrap;
  }
  .badge-reliability {
    font-size: 0.63rem; font-weight: 700; padding: 2px 8px;
    border-radius: 20px; white-space: nowrap;
  }
  .done-badge {
    font-size: 0.65rem; font-weight: 700; padding: 2px 8px;
    border-radius: 20px; background: #eafaf1; color: #1e8449;
    border: 1px solid #1e844933; white-space: nowrap;
  }
  .card-title {
    font-weight: 800; font-size: 0.92rem; color: #111;
    line-height: 1.4; direction: rtl;
  }
  .card-summary {
    font-size: 0.82rem; color: #555; direction: rtl;
    line-height: 1.65; margin-top: 8px;
  }
  .card-address {
    font-size: 0.72rem; color: #999; direction: ltr;
    text-align: right; margin-top: 5px;
  }
  .card-actions {
    display: flex; gap: 8px; justify-content: flex-end;
    align-items: center; margin-top: 10px;
  }
  .btn-link {
    font-size: 0.73rem; font-weight: 700; text-decoration: none;
    background: none; border: none; cursor: pointer;
  }
  .btn-expand {
    font-size: 0.73rem; font-weight: 700;
    border-radius: 20px; padding: 3px 13px; cursor: pointer;
    transition: all 0.18s;
  }
  .btn-fav {
    font-size: 1rem; background: none; border: none;
    cursor: pointer; padding: 2px 6px; opacity: 0.35;
    transition: opacity 0.15s, transform 0.15s;
  }
  .btn-fav:hover  { opacity: 0.7; transform: scale(1.2); }
  .btn-fav-active { opacity: 1 !important; }
  .btn-done-mark {
    font-size: 0.73rem; font-weight: 700;
    border-radius: 20px; padding: 3px 12px; cursor: pointer;
    background: #eafaf1; color: #1e8449;
    border: 1.5px solid #1e8449; transition: all 0.18s;
  }
  .btn-done-mark:hover { background: #1e8449; color: #fff; }
  .btn-undone {
    font-size: 0.73rem; font-weight: 700;
    border-radius: 20px; padding: 3px 11px; cursor: pointer;
    background: #f5eef8; color: #7d3c98;
    border: 1.5px solid #7d3c98;
  }
  .card-details {
    padding: 12px 14px; font-size: 0.82rem;
    color: #333; direction: rtl; line-height: 1.7;
    border-top: 1px solid rgba(0,0,0,0.05);
  }

  /* LOAD MORE */
  .btn-load-more {
    display: block; width: 100%; margin-top: 4px; margin-bottom: 8px;
    padding: 10px; border-radius: 12px; font-size: 0.82rem; font-weight: 700;
    background: #eafaf1; color: #1e8449; border: 1.5px solid #1e8449;
    cursor: pointer; text-align: center; transition: all 0.18s;
  }
  .btn-load-more:hover { background: #1e8449; color: #fff; }
  .btn-load-more:disabled { opacity: 0.5; cursor: default; }

  /* COUNTRY SELECTOR */
  .country-selector { display: flex; gap: 8px; margin-bottom: 12px; position: relative; }
  .country-main-btn {
    flex: 1; padding: 8px 6px; border-radius: 10px;
    border: 1.5px solid #d0d5e0; font-size: 0.78rem; cursor: pointer;
    font-weight: 700; color: #555; background: #fff; text-align: center;
  }
  .country-main-btn.active { background: #fef5ec; border-color: #c0711a; color: #c0711a; }
  .country-dropdown-wrap { flex: 1; position: relative; }
  .country-dropdown {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0;
    background: #fff; border: 1.5px solid #d0d5e0; border-radius: 12px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12); z-index: 50; overflow: hidden;
  }
  .country-dropdown-item {
    display: block; width: 100%; padding: 10px 14px; text-align: right;
    border: none; background: none; cursor: pointer; font-size: 0.8rem;
    font-weight: 600; color: #333; border-bottom: 1px solid #f0f2f8;
  }
  .country-dropdown-item:last-child { border-bottom: none; }
  .country-dropdown-item:hover { background: #f8f9fc; }
  .country-dropdown-item.active { color: #c0711a; background: #fef5ec; }

  /* DONE TAB HEADER */
  .done-section-header {
    text-align: center;
    padding: 18px 0 14px;
  }
  .done-section-title {
    font-size: 1.05rem;
    font-weight: 900;
    color: #7d3c98;
    letter-spacing: 0.5px;
  }
  .done-section-count {
    font-size: 0.75rem;
    color: #999;
    margin-top: 4px;
  }

  /* REFRESH ROW */
  .refresh-row {
    display: flex; justify-content: flex-end; margin-bottom: 10px;
  }
  .btn-refresh {
    font-size: 0.73rem; font-weight: 700;
    background: transparent; border-radius: 20px;
    padding: 4px 13px; cursor: pointer;
  }

  /* LOADING */
  .loading {
    text-align: center; padding: 55px 0; color: #aaa;
  }
  .loading-icon { font-size: 2.2rem; margin-bottom: 10px; }
  .loading-text { font-size: 0.85rem; }
  .loading-bar {
    margin: 16px auto 0; width: 160px; height: 3px;
    background: #e0e0e0; border-radius: 4px; overflow: hidden;
  }
  .loading-bar-inner {
    height: 100%; width: 45%; border-radius: 4px;
    animation: loadslide 1.4s ease-in-out infinite;
  }
  @keyframes loadslide {
    0%   { margin-right: 100%; }
    100% { margin-right: -45%; }
  }

  /* ERROR */
  .error-box {
    background: #fff5f5; border: 1px solid #fca5a5;
    border-radius: 12px; padding: 18px; text-align: center;
    color: #b91c1c; font-size: 0.85rem;
  }
  .btn-retry {
    margin-top: 12px; display: inline-block;
    color: #fff; border: none; border-radius: 8px;
    padding: 8px 22px; cursor: pointer; font-weight: 700; font-size: 0.85rem;
  }

  /* SETTINGS MODAL */
  .modal-bg {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 20px;
  }
  .modal {
    background: #fff; border-radius: 18px;
    width: 100%; max-width: 380px;
    direction: rtl; overflow: hidden;
    max-height: 90vh; display: flex; flex-direction: column;
  }
  .modal-tabs-header {
    display: flex; border-bottom: 1px solid #e8eaf0;
    background: #f8f9fc; flex-shrink: 0; align-items: center;
  }
  .modal-tab-btn {
    flex: 1; padding: 12px 6px; font-size: 0.76rem; font-weight: 700;
    background: transparent; border: none; cursor: pointer;
    color: #888; border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }
  .modal-tab-btn.active { color: #0f3460; border-bottom-color: #0f3460; background: #fff; }
  .modal-close-btn {
    background: none; border: none; cursor: pointer;
    color: #aaa; font-size: 1.1rem; padding: 8px 12px;
    line-height: 1; margin-right: auto;
  }
  .modal-close-btn:hover { color: #333; }
  .modal-content {
    padding: 20px; overflow-y: auto;
  }
  .modal h2 { font-size: 1.05rem; margin-bottom: 6px; }
  .modal p  { font-size: 0.8rem; color: #666; margin-bottom: 14px; line-height: 1.5; }
  .modal input[type="password"] {
    width: 100%; border: 1.5px solid #d0d5e0; border-radius: 10px;
    padding: 10px 12px; font-size: 0.82rem; direction: ltr;
    margin-bottom: 12px; outline: none;
  }
  .modal input[type="password"]:focus { border-color: #1a5276; }
  .modal-btns { display: flex; gap: 8px; }
  .btn-save {
    flex: 1; background: #0f3460; color: #fff; border: none;
    border-radius: 10px; padding: 10px; font-weight: 700;
    font-size: 0.85rem; cursor: pointer;
  }
  .btn-cancel {
    background: #f0f2f8; color: #555; border: none;
    border-radius: 10px; padding: 10px 16px; font-weight: 600;
    font-size: 0.85rem; cursor: pointer;
  }
  .modal-note {
    font-size: 0.72rem; color: #999; margin-top: 10px; line-height: 1.5;
  }

  /* PROFILE */
  .profile-label {
    font-size: 0.72rem; font-weight: 700; color: #888;
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 10px;
  }
  .kid-row {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 8px; padding: 8px 12px;
    background: #f8f9fc; border-radius: 10px;
  }
  .kid-num { font-size: 0.8rem; color: #555; flex: 1; }
  .kid-age-wrap { display: flex; align-items: center; gap: 8px; }
  .kid-age-btn {
    width: 28px; height: 28px; border-radius: 50%;
    background: #fff; border: 1.5px solid #d0d5e0;
    font-size: 1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; color: #0f3460; line-height: 1;
  }
  .kid-age-val {
    font-size: 1rem; font-weight: 700; color: #111;
    min-width: 24px; text-align: center;
  }
  .btn-remove-kid {
    background: none; border: none; cursor: pointer;
    color: #e74c3c; font-size: 1.1rem; font-weight: 700;
    padding: 2px 4px; line-height: 1;
  }
  .btn-add-kid {
    background: #f0f2f8; border: 1.5px dashed #c0c8d8;
    color: #1a5276; border-radius: 10px; padding: 8px 14px;
    font-size: 0.8rem; font-weight: 700; cursor: pointer;
    width: 100%; margin-top: 2px; text-align: center;
  }
  .interests-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .interest-chip {
    padding: 6px 14px; border-radius: 20px;
    border: 1.5px solid #d0d5e0; font-size: 0.8rem;
    cursor: pointer; transition: all 0.15s;
    font-weight: 600; color: #555; user-select: none;
    background: #fff;
  }
  .interest-chip.selected {
    background: #eafaf1; border-color: #1e8449; color: #1e8449;
  }

  /* BACKUP */
  .backup-btns { display: flex; gap: 10px; margin-bottom: 14px; }
  .btn-import-label {
    flex: 1; background: #f0f2f8; color: #555; border: none;
    border-radius: 10px; padding: 10px; font-weight: 700;
    font-size: 0.85rem; cursor: pointer; text-align: center;
    display: block;
  }
  .backup-info {
    background: #f8f9fc; border-radius: 10px; padding: 12px;
    font-size: 0.78rem; color: #666; line-height: 1.9;
  }

  /* SOURCES PANEL */
  .sources-panel {
    background: #f8f9fc; border-radius: 14px; padding: 16px;
    margin-bottom: 10px; border: 1px solid #e0e4ee;
    font-size: 0.82rem; direction: rtl;
  }
  .sources-panel h3 { font-size: 0.9rem; font-weight: 800; color: #0f3460; margin-bottom: 12px; }
  .btn-info {
    width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid currentColor;
    background: transparent; font-size: 0.75rem; font-weight: 700;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; transition: all 0.15s;
  }
  .btn-info:hover { opacity: 0.7; }

  /* PROSE NEWS FORMAT */
  .prose-content { font-size: 0.88rem; line-height: 1.8; color: #222; direction: rtl; }
  .prose-content h1, .prose-content h2 {
    font-size: 1rem; font-weight: 900; color: #0f3460;
    margin: 22px 0 10px; letter-spacing: -0.2px;
  }
  .prose-content h2:first-child { margin-top: 0; }
  .prose-content p { margin: 0 0 10px; }
  .prose-content strong {
    font-size: 0.92rem; font-weight: 800; color: #111;
    display: block; margin: 18px 0 6px;
  }
  .prose-content strong:first-child { margin-top: 0; }
  .prose-content hr { border: none; border-top: 1px solid #e8eaf0; margin: 18px 0; }
  .prose-link {
    color: #1a5276; font-weight: 600; text-decoration: underline;
    cursor: pointer; background: none; border: none; padding: 0;
    font-size: inherit; font-family: inherit; line-height: inherit;
  }
  .prose-link:hover { color: #0f3460; }
  .source-table {
    width: 100%; border-collapse: collapse; font-size: 0.75rem;
    margin: 10px 0; border-radius: 10px; overflow: hidden;
  }
  .source-table th {
    padding: 7px 12px; background: #e8eaf0;
    font-weight: 700; text-align: right; color: #444;
  }
  .source-table td {
    padding: 7px 12px; border-top: 1px solid #e8eaf0;
    text-align: right; color: #555;
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const API_URL  = "https://morning-brief-api.lior0gal.workers.dev";
const MODEL    = "claude-sonnet-4-6";
const INTERESTS_LIST = ["טבע", "תרבות", "הרפתקאה", "אמנות", "ספורט", "אוכל"];
const COUNTRIES_MAIN  = [
  { key:"israel", label:"🇮🇱 ישראל" },
  { key:"world",  label:"🌍 עולם"   },
];
const COUNTRIES_OTHER = [
  { key:"usa",     label:"🇺🇸 ארה״ב"    },
  { key:"uk",      label:"🇬🇧 בריטניה"  },
  { key:"france",  label:"🇫🇷 צרפת"     },
  { key:"germany", label:"🇩🇪 גרמניה"   },
  { key:"italy",   label:"🇮🇹 איטליה"   },
  { key:"spain",   label:"🇪🇸 ספרד"     },
  { key:"japan",   label:"🇯🇵 יפן"      },
  { key:"india",   label:"🇮🇳 הודו"     },
];
const COUNTRIES = [...COUNTRIES_MAIN, ...COUNTRIES_OTHER];

// ─── TIME ─────────────────────────────────────────────────────────────────────
const NOW         = new Date();
const IS_THURSDAY = NOW.getDay() === 4;
const DATE_STR    = NOW.toLocaleDateString("he-IL", { weekday:"long", year:"numeric", month:"long", day:"numeric" });
const TIME_STR    = `${String(NOW.getHours()).padStart(2,"0")}:${String(NOW.getMinutes()).padStart(2,"0")}`;

function getTimeWindow() {
  try {
    const yesterday = new Date(NOW);
    yesterday.setDate(yesterday.getDate() - 1);
    const opts     = { weekday:"long", year:"numeric", month:"long", day:"numeric" };
    const yStr     = yesterday.toLocaleDateString("he-IL", opts);
    const todayStr = NOW.toLocaleDateString("he-IL", opts);
    return `${yStr} 12:00 — ${todayStr} ${TIME_STR}`;
  } catch {
    return `yesterday 12:00 — today ${TIME_STR}`;
  }
}

function getWeekendDates() {
  const day       = NOW.getDay();
  const daysToSat = (6 - day + 7) % 7 || 7;
  const sat       = new Date(NOW); sat.setDate(NOW.getDate() + daysToSat);
  const sun       = new Date(sat); sun.setDate(sat.getDate() + 1);
  const fmt       = d => d.toLocaleDateString("he-IL", { weekday:"long", day:"numeric", month:"long" });
  return `${fmt(sat)} — ${fmt(sun)}`;
}

// ─── TABS ─────────────────────────────────────────────────────────────────────
const TABS = [
  { key:"canada",  label:"🍁 קנדה",    cls:"canada",  color:"#c0392b", bg:"#fff5f5" },
  { key:"toronto", label:"🏙️ טורונטו", cls:"toronto", color:"#1a5276", bg:"#eaf4fb" },
  { key:"custom",  label:"🌍 אחר",     cls:"custom",  color:"#c0711a", bg:"#fef5ec" },
  { key:"weekend", label:"🎉 סופ״ש",   cls:"weekend", color:"#1e8449", bg:"#eafaf1" },
  { key:"done",      label:"✅ ביקרנו",   cls:"done",      color:"#7d3c98", bg:"#f5eef8", hidden:true },
  { key:"favorites", label:"⭐ הדלקת!",  cls:"favorites", color:"#e67e22", bg:"#fef5ec", hidden:true },
];

const DEFAULT_PROFILE = {
  kids:      [{ age:5 }, { age:9 }],
  interests: ["טבע", "הרפתקאה", "תרבות"],
};

// ─── STATE ────────────────────────────────────────────────────────────────────
let state = {
  activeTab:     "canada",
  prose:         {},
  showSources:   null,
  cache:         {},
  loading:       {},
  errors:        {},
  expanded:      {},
  showSettings:  false,
  settingsTab:   "profile",
  weekendExtra:  [],
  loadingMore:   false,
  customCountry:      localStorage.getItem("mbriefing_country") || "israel",
  customDropdownOpen: false,
  profile:  JSON.parse(localStorage.getItem("mbriefing_profile") || JSON.stringify(DEFAULT_PROFILE)),
  done:      JSON.parse(localStorage.getItem("mbriefing_done")      || "[]"),
  favorites: JSON.parse(localStorage.getItem("mbriefing_favorites") || "[]"),
};

// ─── PROFILE HELPERS ──────────────────────────────────────────────────────────
function saveProfile() {
  localStorage.setItem("mbriefing_profile", JSON.stringify(state.profile));
}

function kidsDesc() {
  if (!state.profile.kids.length) return "ללא ילדים";
  return `${state.profile.kids.length} ילדים, גילאים: ${state.profile.kids.map(k => k.age).join(", ")}`;
}

function interestsDesc() {
  return state.profile.interests.length ? state.profile.interests.join(", ") : "כללי";
}

// ─── PROMPTS (weekend only — news tabs handled server-side with Brave Search) ──
function getPrompt(tab) {
  if (tab === "weekend") {
    const wknd = getWeekendDates();
    return `Today is ${DATE_STR} in Toronto, Canada.
Family: ${kidsDesc()}. Interests: ${interestsDesc()}.
Write weekend activity recommendations in fluent, natural, high-quality Hebrew. Generate exactly 6 activities for this family, weekend of ${wknd}. North York / Toronto area, max 2hr drive.
Each item: title (Hebrew), summary (2 משפטים בעברית תקנית), details (3 משפטים בעברית תקנית עם שעות ועלויות), category (טבע|תרבות|הרפתקאה|אמנות|ספורט|אוכל), emoji, distance (~X דקות נסיעה), address (English), url (website or "").
Return ONLY a raw JSON array. No markdown, no backticks, no explanation.`;

function getLoadMoreWeekendPrompt(existingTitles) {

Family: ${kidsDesc()}. Interests: ${interestsDesc()}.
Generate 6 MORE weekend activities for this family, weekend of ${wknd}. North York / Toronto area, max 2hr drive. Be concise.
These activities already exist — do NOT repeat them: ${existingTitles}.
Each item: title (Hebrew), summary (2 Hebrew sentences), details (3 Hebrew sentences with hours and cost), category (טבע|תרבות|הרפתקאה|אמנות|ספורט|אוכל), emoji, distance (~X דקות נסיעה), address (English), url ("").
Return ONLY a raw JSON array. No markdown, no backticks, no explanation.`;

// ─── API CALLS ────────────────────────────────────────────────────────────────
async function callNewsTab(tab) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", API_URL);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.timeout = 120000;
    xhr.onload  = () => {
      try { resolve(JSON.parse(xhr.responseText)); }
      catch { reject(new Error(`HTTP ${xhr.status}: response not JSON`)); }
    };
    xhr.onerror   = () => reject(new Error("XHR network error"));
    xhr.ontimeout = () => reject(new Error("Request timed out (120s) — נסי שוב"));
    xhr.send(JSON.stringify({ tab, customCountry: state.customCountry, dateStr: DATE_STR }));
  });
}

async function callAPI(prompt) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    xhr.open("POST", API_URL);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.timeout = 90000;
    xhr.onload  = () => {
      try { resolve(JSON.parse(xhr.responseText)); }
      catch { reject(new Error(`HTTP ${xhr.status}: response not JSON`)); }
    };
    xhr.onerror   = () => reject(new Error("XHR network error"));
    xhr.ontimeout = () => reject(new Error("Request timed out (90s) — נסי שוב"));
    xhr.send(JSON.stringify({
      model:      MODEL,
      max_tokens: 3000,
      system:     "אתה עיתונאי ישראלי מנוסה. כתוב תמיד בעברית רהוטה, טבעית ומדויקת — כאילו אתה חושב ישירות בעברית, לא מתרגם מאנגלית. השתמש במבנה משפטים עיתונאי ישראלי: קצר, ברור, ענייני. הימנע מתרגומים מילוליים ומבניות לועזית.",
      messages:   [{ role:"user", content: prompt }],
    }));
  });
}

function parseAPIResponse(data) {
  if (data.error) throw new Error(data.error.message);
  const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("");
  let parsed = null;
  const attempts = [
    () => JSON.parse(text.trim()),
    () => JSON.parse(text.replace(/```json\s*/gi, "").replace(/```\s*/g, "").trim()),
    () => { const m = text.match(/\[[\s\S]*\]/); if (m) return JSON.parse(m[0]); throw new Error(); },
  ];
  for (const fn of attempts) {
    try { parsed = fn(); break; } catch {}
  }
  if (!parsed) throw new Error("שגיאה בניתוח התשובה מ-Claude: " + text.slice(0, 80));
  return parsed;
}

async function fetchTab(tab) {
  if (tab === "done" || tab === "favorites") return;

  state.loading[tab] = true;
  state.errors[tab]  = null;
  render();

  try {
    if (tab === "weekend") {
      const data   = await callAPI(getPrompt("weekend"));
      const parsed = parseAPIResponse(data);
      state.cache[tab] = parsed;
    } else {
      const data = await callNewsTab(tab);
      if (data.error) throw new Error(data.error.message || "שגיאה");
      state.prose[tab] = { content: data.content, sources: data.sources };
    }
  } catch(e) {
    state.errors[tab] = e?.message || "שגיאה בטעינה. נסי שוב.";
  } finally {
    state.loading[tab] = false;
    render();
  }
}

async function loadMoreWeekend() {
  const allItems    = (state.cache.weekend || []).concat(state.weekendExtra);
  const existingTitles = allItems.map(i => i.title).join(", ");

  state.loadingMore = true;
  render();

  try {
    const data   = await callAPI(getLoadMoreWeekendPrompt(existingTitles));
    const parsed = parseAPIResponse(data);
    state.weekendExtra = state.weekendExtra.concat(parsed);
  } catch(e) {
    // silent fail — just stop loading
  } finally {
    state.loadingMore = false;
    render();
  }
}

// ─── DONE ─────────────────────────────────────────────────────────────────────
function markDone(tabKey, idx) {
  const allItems = tabKey === "weekend"
    ? (state.cache.weekend || []).concat(state.weekendExtra)
    : state.cache[tabKey];
  const item = allItems[idx];
  state.done = state.done.filter(d => d.title !== item.title);
  state.done.unshift({ ...item, _doneAt: new Date().toISOString() });
  localStorage.setItem("mbriefing_done", JSON.stringify(state.done));
  render();
}

function unmarkDone(idx) {
  state.done.splice(idx, 1);
  localStorage.setItem("mbriefing_done", JSON.stringify(state.done));
  render();
}

const isDone = title => state.done.some(d => d.title === title);

// ─── FAVORITES ────────────────────────────────────────────────────────────────
function toggleFavorite(tabKey, idx) {
  const item = state.cache[tabKey]?.[idx] || state.weekendExtra[idx - (state.cache[tabKey]?.length || 0)];
  if (!item) return;
  if (isFavorite(item.title)) {
    state.favorites = state.favorites.filter(f => f.title !== item.title);
  } else {
    state.favorites.unshift({ ...item, _favAt: new Date().toISOString() });
  }
  localStorage.setItem("mbriefing_favorites", JSON.stringify(state.favorites));
  render();
}

function removeFavorite(idx) {
  state.favorites.splice(idx, 1);
  localStorage.setItem("mbriefing_favorites", JSON.stringify(state.favorites));
  render();
}

const isFavorite = title => state.favorites.some(f => f.title === title);

// ─── BACKUP ───────────────────────────────────────────────────────────────────
function exportBackup() {
  const payload = {
    version:  1,
    exported: new Date().toISOString(),
    profile:  state.profile,
    done:     state.done,
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:"application/json" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href     = url;
  a.download = `morning-brief-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importBackup(file) {
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.profile) { state.profile = data.profile; saveProfile(); }
      if (data.done)    { state.done    = data.done;    localStorage.setItem("mbriefing_done", JSON.stringify(data.done)); }
      state.showSettings = false;
      render();
    } catch { alert("קובץ גיבוי לא תקין"); }
  };
  reader.readAsText(file);
}

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  const scrollY = window.scrollY;
  document.getElementById("app").innerHTML = buildHTML();
  window.scrollTo(0, scrollY);
  attachEvents();
}

// ─── MARKDOWN RENDERER ────────────────────────────────────────────────────────
function inlineMd(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, t, u) =>
      `<button class="prose-link" data-open="${u}">${t}</button>`)
    .replace(/`(.+?)`/g, '<code>$1</code>');
}

function buildMdTable(lines) {
  const rows = lines.filter(l => !/^\|[\s\-:|]+\|$/.test(l.trim()));
  if (!rows.length) return '';
  let html = '<table class="source-table"><thead>';
  rows.forEach((row, i) => {
    const cells = row.split('|').slice(1, -1).map(c => c.trim());
    if (i === 1) html += '</thead><tbody>';
    const tag = i === 0 ? 'th' : 'td';
    html += '<tr>' + cells.map(c => `<${tag}>${inlineMd(c)}</${tag}>`).join('') + '</tr>';
  });
  html += '</tbody></table>';
  return html;
}

function renderMarkdown(md) {
  if (!md) return '';
  const lines = md.split('\n');
  let html = '', tableLines = [], inTable = false;

  const flushTable = () => {
    if (tableLines.length) { html += buildMdTable(tableLines); tableLines = []; }
    inTable = false;
  };

  for (const line of lines) {
    if (line.trim().startsWith('|')) {
      inTable = true;
      tableLines.push(line);
    } else {
      if (inTable) flushTable();
      if      (line.startsWith('## ')) html += `<h2>${inlineMd(line.slice(3))}</h2>`;
      else if (line.startsWith('# '))  html += `<h1>${inlineMd(line.slice(2))}</h1>`;
      else if (line.trim() === '---')  html += '<hr>';
      else if (line.trim())            html += `<p>${inlineMd(line)}</p>`;
    }
  }
  if (inTable) flushTable();
  return html;
}

function buildHTML() {
  const tab = TABS.find(t => t.key === state.activeTab);
  return `
    ${state.showSettings ? buildSettingsModal() : ""}
    <div class="header">
      <div style="max-width:620px;margin:0 auto">
        <div class="header-top">
          <div>
            <div class="header-eyebrow">MORNING BRIEFING</div>
            <div class="header-title">☀️ בוקר טוב, ליאור</div>
            <div class="header-date">${DATE_STR}</div>
          </div>
          <button class="btn-settings" id="btn-settings">⚙️ הגדרות</button>
        </div>
        ${IS_THURSDAY ? `<div class="thursday-badge">🎉 יום חמישי — כולל המלצות סופ״ש!</div>` : ""}
        <div class="tabs">
          ${TABS.filter(t => !t.hidden).map(t => `
            <button class="tab ${t.cls}${state.activeTab === t.key ? " active" : ""}" data-tab="${t.key}">
              ${t.label}
              ${t.key === "weekend" && IS_THURSDAY ? `<span class="tab-new">חדש</span>` : ""}
              ${t.key === "done"      && state.done.length      ? `<span class="tab-count">${state.done.length}</span>`      : ""}
              ${t.key === "favorites" && state.favorites.length ? `<span class="tab-count" style="background:#e67e22">${state.favorites.length}</span>` : ""}
            </button>
          `).join("")}
        </div>
      </div>
    </div>
    <div class="content">
      ${buildTabContent(state.activeTab, tab)}
    </div>`;
}

function buildTabContent(tabKey, tab) {
  if (tabKey === "done")      return buildDoneContent(tab);
  if (tabKey === "favorites") return buildFavoritesContent(tab);

  const countrySelector = tabKey === "custom" ? buildCountrySelector() : "";

  // Weekend shortcut bar
  const weekendBar = tabKey === "weekend" ? `
    <div class="refresh-row" style="justify-content:space-between">
      <div style="display:flex;gap:6px">
        <button class="btn-refresh" style="border:1.5px solid #7d3c98;color:#7d3c98" data-switch-tab="done">✅ ביקרנו${state.done.length ? ` (${state.done.length})` : ""}</button>
        <button class="btn-refresh" style="border:1.5px solid #e67e22;color:#e67e22" data-switch-tab="favorites">⭐ הדלקת!${state.favorites.length ? ` (${state.favorites.length})` : ""}</button>
      </div>
      <button class="btn-refresh" style="border:1.5px solid ${tab.color};color:${tab.color}" data-retry="${tabKey}">🔄 רענן</button>
    </div>` : "";

  const loadingText = tabKey === "weekend" ? "טוענת פעילויות..." : "מחפש חדשות עדכניות ברשת...";

  if (state.loading[tabKey]) return `
    ${weekendBar}${countrySelector}
    <div class="loading">
      <div class="loading-icon">${tabKey === "weekend" ? "🎉" : "🌐"}</div>
      <div class="loading-text">${loadingText}</div>
      <div class="loading-bar"><div class="loading-bar-inner" style="background:${tab.color}"></div></div>
    </div>`;

  if (state.errors[tabKey]) return `
    ${weekendBar}${countrySelector}
    <div class="error-box">
      <div>${state.errors[tabKey]}</div>
      <button class="btn-retry" style="background:${tab.color}" data-retry="${tabKey}">נסי שוב</button>
    </div>`;

  // ── NEWS TABS: prose format ──────────────────────────────────────────────────
  if (tabKey !== "weekend") {
    const prose = state.prose[tabKey];
    if (!prose) return `
      ${countrySelector}
      <div class="loading">
        <div class="loading-icon">🔍</div>
        <div class="loading-text">לחצי טעינה להתחיל</div>
        <button class="btn-retry" style="background:${tab.color};display:inline-block;margin-top:14px" data-retry="${tabKey}">טעני עכשיו</button>
      </div>`;
    const showSources = state.showSources === tabKey;
    return `
      ${countrySelector}
      <div class="refresh-row" style="justify-content:space-between">
        <button class="btn-info" style="color:${tab.color}" data-sources-tab="${tabKey}" title="מידע על המקורות">ℹ</button>
        <button class="btn-refresh" style="border:1.5px solid ${tab.color};color:${tab.color}" data-retry="${tabKey}">🔄 רענן</button>
      </div>
      ${showSources && prose.sources ? `
        <div class="sources-panel">
          <h3>📰 מידע על המקורות</h3>
          ${renderMarkdown(prose.sources)}
        </div>` : ""}
      <div class="card prose-content" style="padding:18px 16px 14px">
        ${renderMarkdown(prose.content)}
      </div>`;
  }

  // ── WEEKEND TAB: activity cards ──────────────────────────────────────────────
  const allWeekend = (state.cache.weekend || []).concat(state.weekendExtra);
  if (!allWeekend.length) return `
    ${weekendBar}
    <div class="loading">
      <div class="loading-icon">🔍</div>
      <div class="loading-text">לחצי טעינה להתחיל</div>
      <button class="btn-retry" style="background:${tab.color};display:inline-block;margin-top:14px" data-retry="${tabKey}">טעני עכשיו</button>
    </div>`;
  return `
    ${weekendBar}
    ${allWeekend.map((item, i) => buildCard(item, i, tab, true)).join("")}
    ${state.loadingMore
      ? `<div class="loading" style="padding:22px 0"><div class="loading-bar" style="margin:0 auto"><div class="loading-bar-inner" style="background:${tab.color}"></div></div></div>`
      : `<button class="btn-load-more" id="btn-load-more">טען עוד ▼</button>`
    }`;
}

function buildCountrySelector() {
  const isOther   = !COUNTRIES_MAIN.some(c => c.key === state.customCountry);
  const otherSel  = isOther ? COUNTRIES_OTHER.find(c => c.key === state.customCountry) : null;
  const otherLabel = otherSel ? otherSel.label : "אחר ▾";
  return `
    <div class="country-selector">
      ${COUNTRIES_MAIN.map(c => `
        <button class="country-main-btn${state.customCountry === c.key ? " active" : ""}" data-country="${c.key}">${c.label}</button>
      `).join("")}
      <div class="country-dropdown-wrap">
        <button class="country-main-btn${isOther ? " active" : ""}" id="btn-other-country">${otherLabel}</button>
        ${state.customDropdownOpen ? `
          <div class="country-dropdown" id="country-dropdown">
            ${COUNTRIES_OTHER.map(c => `
              <button class="country-dropdown-item${state.customCountry === c.key ? " active" : ""}" data-country="${c.key}">${c.label}</button>
            `).join("")}
          </div>
        ` : ""}
      </div>
    </div>`;
}

function buildFavoritesContent(tab) {
  if (!state.favorites.length) return `
    <div class="loading">
      <div class="loading-icon">⭐</div>
      <div class="loading-text">לחצי ⭐ על פעילות סופ״ש כדי לשמור אותה כאן</div>
    </div>`;
  return `
    <div class="done-section-header">
      <div class="done-section-title" style="color:#e67e22">הדלקת!</div>
      <div class="done-section-count">${state.favorites.length} פעילויות מועדפות</div>
    </div>
    ${state.favorites.map((item, i) => buildFavoriteCard(item, i, tab)).join("")}`;
}

function buildDoneContent(tab) {
  if (!state.done.length) return `
    <div class="loading">
      <div class="loading-icon">🗺️</div>
      <div class="loading-text">עדיין לא סימנת פעילויות שביצעת</div>
    </div>`;

  return `
    <div class="done-section-header">
      <div class="done-section-title">Been There Done That</div>
      <div class="done-section-count">${state.done.length} פעילות שביצעת</div>
    </div>
    ${state.done.map((item, i) => buildDoneCard(item, i, tab)).join("")}`;

function buildReliabilityBadge(reliability) {
  if (!reliability) return "";
  const map = {
    "גבוהה":  { bg:"#eafaf1", color:"#1e8449", border:"#1e844933" },
    "בינונית": { bg:"#fef9ec", color:"#b7770d", border:"#b7770d33" },
    "נמוכה":  { bg:"#fff5f5", color:"#c0392b", border:"#c0392b33" },
  };
  const s = map[reliability] || map["בינונית"];
  return `<span class="badge-reliability" style="background:${s.bg};color:${s.color};border:1px solid ${s.border}">${reliability}</span>`;
}

function buildCard(item, i, tab, isWeekend) {
  const expKey  = `${tab.key}-${i}`;
  const isOpen  = state.expanded[expKey];
  const done    = isDone(item.title);
  const title   = item.title || '';
  const srcUrl  = (item.url && item.url.startsWith('http'))
    ? item.url
    : 'https://www.google.com/search?q=' + encodeURIComponent(title + (item.source ? ' ' + item.source : '')) + '&tbm=nws';
  return `
    <div class="card${done ? " card-done" : ""}">
      <div class="card-body">
        <div class="card-top">
          <span class="card-emoji">${item.emoji || "📌"}</span>
          <div style="flex:1;min-width:0">
            <div class="card-meta">
              <span class="badge" style="background:${tab.color}18;color:${tab.color};border:1px solid ${tab.color}33">${item.category}</span>
              ${item.distance ? `<span style="font-size:0.68rem;color:#1e8449;font-weight:700">📍 ${item.distance}</span>` : ""}
              ${item.reliability ? buildReliabilityBadge(item.reliability) : ""}
              ${done ? `<span class="done-badge">✓ ביקרנו</span>` : ""}
            </div>
            <div class="card-title">${item.title}</div>
            ${item.published || item.source ? `<div style="font-size:0.65rem;color:#aaa;margin-top:2px">${item.published ? `🕐 ${item.published}` : ""}${item.published && item.source ? " · " : ""}${item.source ? item.source : ""}</div>` : ""}
          </div>
        </div>
        <div class="card-summary">${item.summary}</div>
        ${item.address ? `<div class="card-address">📌 ${item.address}</div>` : ""}
        <div class="card-actions">
          ${!isWeekend ? `<button class="btn-link" style="color:${tab.color}" data-open="${srcUrl}">${item.url && item.url.startsWith('http') ? "מקור ↗" : "חיפוש ↗"}</button>` : (item.url ? `<button class="btn-link" style="color:${tab.color}" data-open="${item.url}">אתר ↗</button>` : "")}
          ${isWeekend ? `<button class="btn-fav${isFavorite(item.title) ? " btn-fav-active" : ""}" data-fav-tab="${tab.key}" data-fav-idx="${i}" title="${isFavorite(item.title) ? "הסר ממועדפים" : "הוסף למועדפים"}">⭐</button>` : ""}
          ${isWeekend && !done ? `<button class="btn-done-mark" data-done-tab="${tab.key}" data-done-idx="${i}">✓ ביקרנו</button>` : ""}
          <button class="btn-expand"
            style="background:${isOpen ? tab.color : "#fff"};color:${isOpen ? "#fff" : tab.color};border:1.5px solid ${tab.color}"
            data-expand="${expKey}">
            ${isOpen ? "סגור ▲" : "עוד ▼"}
          </button>
        </div>
      </div>
      ${isOpen ? `<div class="card-details" style="background:${tab.bg}">${item.details}</div>` : ""}
    </div>`;
}

function buildDoneCard(item, i, tab) {
  const expKey   = `done-${i}`;
  const isOpen   = state.expanded[expKey];
  const doneDate = item._doneAt
    ? new Date(item._doneAt).toLocaleDateString("he-IL", { day:"numeric", month:"long", year:"numeric" })
    : "";
  return `
    <div class="card card-done-archive">
      <div class="card-body">
        <div class="card-top">
          <span class="card-emoji">${item.emoji || "📌"}</span>
          <div style="flex:1;min-width:0">
            <div class="card-meta">
              <span class="badge" style="background:${tab.color}18;color:${tab.color};border:1px solid ${tab.color}33">${item.category || ""}</span>
              ${item.distance ? `<span style="font-size:0.68rem;color:#1e8449;font-weight:700">📍 ${item.distance}</span>` : ""}
            </div>
            <div class="card-title">${item.title}</div>
            ${doneDate ? `<div style="font-size:0.68rem;color:#7d3c98;margin-top:3px;font-weight:600">✓ ${doneDate}</div>` : ""}
          </div>
        </div>
        <div class="card-summary">${item.summary}</div>
        ${item.address ? `<div class="card-address">📌 ${item.address}</div>` : ""}
        <div class="card-actions">
          ${item.url ? `<button class="btn-link" style="color:${tab.color}" data-open="${item.url}">קישור ↗</button>` : ""}
          <button class="btn-undone" data-undone-idx="${i}">↩ הסר</button>
          <button class="btn-expand"
            style="background:${isOpen ? tab.color : "#fff"};color:${isOpen ? "#fff" : tab.color};border:1.5px solid ${tab.color}"
            data-expand="${expKey}">
            ${isOpen ? "סגור ▲" : "עוד ▼"}
          </button>
        </div>
      </div>
      ${isOpen ? `<div class="card-details" style="background:${tab.bg}">${item.details}</div>` : ""}
    </div>`;
}

// ─── SETTINGS MODAL ───────────────────────────────────────────────────────────
function buildSettingsModal() {
  return `
    <div class="modal-bg" id="modal-bg">
      <div class="modal">
        <div class="modal-tabs-header">
          <button class="modal-tab-btn${state.settingsTab === "profile" ? " active" : ""}" data-stab="profile">👨‍👩‍👧 פרופיל</button>
          <button class="modal-tab-btn${state.settingsTab === "backup"  ? " active" : ""}" data-stab="backup">💾 גיבוי</button>
          <button class="modal-close-btn" id="btn-modal-close">✕</button>
        </div>
        <div class="modal-content">
          ${state.settingsTab === "profile" ? buildProfileTab() : ""}
          ${state.settingsTab === "backup"  ? buildBackupTab()  : ""}
        </div>
      </div>
    </div>`;
}

function buildProfileTab() {
  const kids = state.profile.kids;
  return `
    <h2>👨‍👩‍👧 פרופיל משפחתי</h2>
    <p>הגדרות הפרופיל משפיעות על המלצות הסופ״ש ונשמרות אוטומטית.</p>

    <div class="profile-label">ילדים</div>
    ${kids.map((kid, i) => `
      <div class="kid-row">
        <span class="kid-num">ילד ${i + 1}</span>
        <div class="kid-age-wrap">
          <button class="kid-age-btn" data-kid="${i}" data-dir="-1">−</button>
          <span class="kid-age-val" data-kid="${i}">${kid.age}</span>
          <button class="kid-age-btn" data-kid="${i}" data-dir="1">+</button>
        </div>
        <button class="btn-remove-kid" data-kid="${i}">×</button>
      </div>
    `).join("")}
    <button class="btn-add-kid" id="btn-add-kid">+ הוסף ילד</button>

    <div class="profile-label" style="margin-top:18px">תחומי עניין לסופ״ש</div>
    <div class="interests-grid">
      ${INTERESTS_LIST.map(v => `
        <span class="interest-chip${state.profile.interests.includes(v) ? " selected" : ""}" data-interest="${v}">${v}</span>
      `).join("")}
    </div>

    <div class="modal-btns" style="margin-top:18px">
      <button class="btn-cancel" id="btn-cancel-modal">סגור</button>
    </div>`;
}

function buildBackupTab() {
  return `
    <h2>💾 גיבוי ושחזור</h2>
    <p>הגיבוי כולל: פרופיל משפחתי ופעילויות שביצעת.</p>
    <div class="backup-btns">
      <button class="btn-save" id="btn-export">⬇️ ייצוא</button>
      <label class="btn-import-label">
        📂 ייבוא
        <input type="file" id="import-file" accept=".json" style="display:none">
      </label>
    </div>
    <div class="backup-info">
      <div>ילדים: ${kidsDesc()}</div>
      <div>תחומי עניין: ${interestsDesc()}</div>
      <div>פעילויות שביצעת: <strong>${state.done.length}</strong></div>
    </div>
    <div class="modal-btns" style="margin-top:14px"><button class="btn-cancel" id="btn-cancel-modal">סגור</button></div>`;
}

// ─── EVENTS ───────────────────────────────────────────────────────────────────
function attachEvents() {
  // Tab switch
  document.querySelectorAll(".tab[data-tab]").forEach(el => {
    el.addEventListener("click", () => {
      const key = el.dataset.tab;
      state.activeTab = key;
      state.showSources = null;
      if (key !== "done" && key !== "favorites" && !state.prose[key] && !state.cache[key] && !state.loading[key]) fetchTab(key);
      else render();
    });
  });

  // Open external URL — navigator.standalone detects iOS home-screen mode
  const isStandalone = !!window.navigator.standalone;
  document.querySelectorAll("[data-open]").forEach(el => {
    el.addEventListener("click", () => {
      const url = el.dataset.open;
      if (isStandalone) {
        window.location.href = url;
      } else {
        window.open(url, '_blank', 'noopener');
      }
    });
  });

  // Sources ℹ button
  document.querySelectorAll("[data-sources-tab]").forEach(el => {
    el.addEventListener("click", () => {
      const key = el.dataset.sourcesTab;
      state.showSources = state.showSources === key ? null : key;
      render();
    });
  });

  // Weekend shortcut buttons → switch tab
  document.querySelectorAll("[data-switch-tab]").forEach(el => {
    el.addEventListener("click", () => { state.activeTab = el.dataset.switchTab; render(); });
  });

  // Retry / refresh / load
  document.querySelectorAll("[data-retry]").forEach(el => {
    el.addEventListener("click", () => {
      const key = el.dataset.retry;
      state.cache[key] = null;
      state.prose[key] = null;
      if (key === "weekend") { state.weekendExtra = []; }
      fetchTab(key);
    });
  });

  // Expand / collapse
  document.querySelectorAll("[data-expand]").forEach(el => {
    el.addEventListener("click", () => { const k = el.dataset.expand; state.expanded[k] = !state.expanded[k]; render(); });
  });

  // Mark done
  document.querySelectorAll("[data-done-tab]").forEach(el => {
    el.addEventListener("click", () => markDone(el.dataset.doneTab, parseInt(el.dataset.doneIdx)));
  });

  // Star / unstar favorite
  document.querySelectorAll("[data-fav-tab]").forEach(el => {
    el.addEventListener("click", () => toggleFavorite(el.dataset.favTab, parseInt(el.dataset.favIdx)));
  });

  // Remove from favorites
  document.querySelectorAll("[data-unfav-idx]").forEach(el => {
    el.addEventListener("click", () => removeFavorite(parseInt(el.dataset.unfavIdx)));
  });

  // Unmark done
  document.querySelectorAll("[data-undone-idx]").forEach(el => {
    el.addEventListener("click", () => unmarkDone(parseInt(el.dataset.undoneIdx)));
  });

  // Open settings
  const settingsBtn = document.getElementById("btn-settings");
  if (settingsBtn) settingsBtn.addEventListener("click", () => { state.showSettings = true; render(); });

  // Settings modal tab switch
  document.querySelectorAll("[data-stab]").forEach(el => {
    el.addEventListener("click", () => { state.settingsTab = el.dataset.stab; render(); });
  });

  // Close modal — X button
  const modalCloseBtn = document.getElementById("btn-modal-close");
  if (modalCloseBtn) modalCloseBtn.addEventListener("click", () => { state.showSettings = false; render(); });

  // Close modal — סגור button inside tabs
  const cancelBtn = document.getElementById("btn-cancel-modal");
  if (cancelBtn) cancelBtn.addEventListener("click", () => { state.showSettings = false; render(); });

  // Close country dropdown when clicking outside
  if (state.customDropdownOpen) {
    document.addEventListener("click", () => { state.customDropdownOpen = false; render(); }, { once: true });
  }

  // Click outside modal
  const modalBg = document.getElementById("modal-bg");
  if (modalBg) modalBg.addEventListener("click", e => {
    if (e.target === modalBg) { state.showSettings = false; render(); }
  });

  // Add kid (auto-saves)
  const addKidBtn = document.getElementById("btn-add-kid");
  if (addKidBtn) addKidBtn.addEventListener("click", () => {
    state.profile.kids.push({ age: 5 });
    saveProfile();
    render();
  });

  // Remove kid (auto-saves)
  document.querySelectorAll(".btn-remove-kid").forEach(el => {
    el.addEventListener("click", () => {
      state.profile.kids.splice(parseInt(el.dataset.kid), 1);
      saveProfile();
      render();
    });
  });

  // Kid age stepper — updates state + DOM directly, no full re-render
  document.querySelectorAll(".kid-age-btn").forEach(el => {
    el.addEventListener("click", () => {
      const i      = parseInt(el.dataset.kid);
      const newAge = Math.max(0, Math.min(18, state.profile.kids[i].age + parseInt(el.dataset.dir)));
      state.profile.kids[i].age = newAge;
      saveProfile();
      const valEl = document.querySelector(`.kid-age-val[data-kid="${i}"]`);
      if (valEl) valEl.textContent = newAge;
    });
  });

  // Interest chip toggle (auto-saves)
  document.querySelectorAll(".interest-chip").forEach(chip => {
    chip.addEventListener("click", () => {
      const v = chip.dataset.interest;
      chip.classList.toggle("selected");
      const idx = state.profile.interests.indexOf(v);
      if (idx === -1) state.profile.interests.push(v);
      else state.profile.interests.splice(idx, 1);
      saveProfile();
    });
  });

  // Country chip selection
  const otherBtn = document.getElementById("btn-other-country");
  if (otherBtn) otherBtn.addEventListener("click", e => {
    e.stopPropagation();
    state.customDropdownOpen = !state.customDropdownOpen;
    render();
  });

  document.querySelectorAll("[data-country]").forEach(el => {
    el.addEventListener("click", () => {
      const key = el.dataset.country;
      state.customDropdownOpen = false;
      if (state.customCountry === key) return;
      state.customCountry = key;
      localStorage.setItem("mbriefing_country", key);
      state.cache.custom = null;
      state.prose.custom = null;
      fetchTab("custom");
    });
  });

  // Load more weekend
  const loadMoreBtn = document.getElementById("btn-load-more");
  if (loadMoreBtn) loadMoreBtn.addEventListener("click", loadMoreWeekend);

  // Export backup
  const exportBtn = document.getElementById("btn-export");
  if (exportBtn) exportBtn.addEventListener("click", exportBackup);

  // Import backup
  const importFile = document.getElementById("import-file");
  if (importFile) importFile.addEventListener("change", e => { if (e.target.files[0]) importBackup(e.target.files[0]); });
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
render();
fetchTab(state.activeTab);
</script>
</body>
</html>
